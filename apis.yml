name: RunAnywhere
description: >-
  RunAnywhere is a Y Combinator (W2026) infrastructure company building the
  layer for deploying fast, private, multimodal AI on-device at scale. It ships
  one open-source C++ core runtime with native bindings for Swift, Kotlin,
  React Native, Flutter, and the browser, plus hand-written GPU/NPU inference
  engines (MetalRT for Apple GPUs, QHexRT for Qualcomm Hexagon NPUs) that run
  LLM, VLM, speech-to-text, text-to-speech, and embedding workloads locally.
  The SDKs handle model delivery, extraction, storage management, versioning,
  and observability, and support hybrid routing that tries on-device inference
  first before optionally falling back to the cloud. A hosted control plane
  (api.runanywhere.ai) manages model delivery and configuration via API key.
